<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lullall · 个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="logo">lullall</div>
    <nav class="nav-links">
      <a href="#about">关于</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <!-- 主体内容 -->
  <main>
    <!-- 大标题 + 自我介绍 -->
    <section class="hero" id="about">
      <h1 class="title">我是 lullall</h1>
      <p class="intro">
        你好！我是一名正在学习编程的开发者，对前端技术充满热情。
        我喜欢把想法变成简洁、好用的界面。这是我的面试作品集，
        欢迎了解我做过的一些小项目。
      </p>
    </section>

    <!-- 项目卡片占位符 -->
    <section class="projects" id="projects">
      <h2 class="section-title">我的项目</h2>
      <div class="card-grid">
        <article class="card">
          <div class="card-thumb"></div>
          <h3 class="card-title">项目一</h3>
          <p class="card-desc">这里放一段项目简介占位文字。</p>
        </article>
        <article class="card">
          <div class="card-thumb"></div>
          <h3 class="card-title">项目二</h3>
          <p class="card-desc">这里放一段项目简介占位文字。</p>
        </article>
        <article class="card">
          <div class="card-thumb"></div>
          <h3 class="card-title">项目三</h3>
          <p class="card-desc">这里放一段项目简介占位文字。</p>
        </article>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer" id="contact">
    <p>© 2026 lullall · 用 HTML 和 CSS 制作</p>
  </footer>
</body>
</html>
